[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "veraport-agent-reference"
version = "0.4.0"
description = "Reference VeraPort persistent workstation bridge and MCP adapter for VeraMesh"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<49",
  "mcp>=2,<3"
]

[project.optional-dependencies]
windows-service = [
  "pywin32>=311"
]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2"
]

[project.scripts]
veraport-agent = "veraport_agent.stdio:main"
veraport-service = "veraport_agent.windows_service:service_cli"
veraport-mcp = "veraport_agent.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
