[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "veraport-agent-reference"
version = "0.1.0"
description = "Reference VeraPort logical-lane execution agent for VeraMesh"
requires-python = ">=3.11"

[project.scripts]
veraport-agent = "veraport_agent.stdio:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
