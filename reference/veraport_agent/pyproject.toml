[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "veraport-agent-reference"
version = "0.3.0"
description = "Reference VeraPort persistent workstation bridge for VeraMesh"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<49"
]

[project.optional-dependencies]
windows-service = [
  "pywin32>=311"
]
mcp = [
  "mcp>=1.20,<2"
]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2"
]

[project.scripts]
veraport-agent = "veraport_agent.stdio:main"
veraport-service = "veraport_agent.windows_service:service_cli"
veraport-mcp = "veraport_agent.mcp_server:main"
veraport-live-edge = "veraport_agent.verarelay_live_edge:main"
veraport-provision = "veraport_agent.provision:main"
veraport-doctor = "veraport_agent.doctor:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
